name: CD

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Serialize publishes so a slower build for an older tag cannot finish after a
# newer one and move the shared major.minor and latest aliases backwards.
concurrency:
  group: cd-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/triflare/kamix-archives
          flavor: |
            latest=false
          # Stable tags move the major.minor and latest aliases; a prerelease
          # such as 1.3.0-alpha.1 is published under its exact version only.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Kamix Archives
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.source=${{ github.event.repository.clone_url }}
      - name: Fail if no image tag was generated
        if: ${{ steps.meta.outputs.tags == '' }}
        env:
          GITHUB_REF: ${{ github.ref }}
        run: echo "No image tags were generated for ref $GITHUB_REF." && exit 1
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
