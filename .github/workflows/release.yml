name: Release

on:
  push:
    branches: [latest, beta, alpha]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Publish release
    # semantic-release pushes the release commit back to the branch. Skip it
    # here so that commit does not start another release run.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      # The App token is preferred: commits and tags it creates trigger the CD
      # workflow, which GITHUB_TOKEN cannot do. Without the App credentials the
      # release still runs with GITHUB_TOKEN instead of failing outright.
      - name: Check for release app credentials
        id: app
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASE_APP_ID or RELEASE_APP_PRIVATE_KEY is missing; releasing with GITHUB_TOKEN, so the release tag will not trigger the CD workflow."
          fi
      - name: Create GitHub App token
        id: app-token
        if: ${{ steps.app.outputs.configured == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: triflare
          repositories: kamix-archives
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
      # @semantic-release/git commits and tags with the checked out identity, so
      # the runner needs one unless the App credentials already provide it.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Set up pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check for formatting errors
        run: pnpm run format:check
      - name: Check for typing errors
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          echo "released=false" >> "$GITHUB_OUTPUT"
          npx semantic-release
